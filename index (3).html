<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11100e" />
  <title>GradConnect — Alumni Network</title>
  <style>
    :root {
      --bg: #f7f1e6;
      --surface: #fffdf8;
      --surface-2: #f1e7d6;
      --text: #17130f;
      --muted: #776d60;
      --gold: #c77d0b;
      --gold-light: #f0b84b;
      --border: #e4d1ad;
      --danger: #a74335;
      --success: #2f7954;
      --shadow: 0 14px 34px rgba(87, 53, 15, .10);
    }

    body.dark {
      --bg: #11100e;
      --surface: #1d1a16;
      --surface-2: #2b241b;
      --text: #f9f0df;
      --muted: #c4b59e;
      --gold: #e4a232;
      --gold-light: #ffd071;
      --border: #624719;
      --shadow: 0 14px 34px rgba(0, 0, 0, .3);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      transition: background .2s, color .2s;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 17px 5%;
      background: var(--surface);
      border-bottom: 2px solid var(--gold);
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
    }
    .brand {
      color: var(--gold);
      font-size: 26px;
      font-weight: bold;
      white-space: nowrap;
    }
    .nav-links { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
    .nav-links button, .icon-button {
      border: 0;
      border-radius: 5px;
      padding: 9px 11px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .nav-links button:hover, .icon-button:hover { color: var(--gold); background: var(--surface-2); }
    .nav-actions { display: flex; gap: 7px; align-items: center; }

    .container { width: min(1120px, 92%); margin: 0 auto; }
    .page { padding: 48px 0 80px; }
    .eyebrow { color: var(--gold); font-size: 12px; letter-spacing: 4px; text-transform: uppercase; }
    h1 { margin: 8px 0 0; font-size: clamp(36px, 7vw, 64px); line-height: 1; }
    h2 { margin: 0 0 12px; font-size: 32px; }
    h3 { margin: 0 0 8px; }
    .deco-line { width: 145px; height: 4px; margin: 17px 0 30px; background: linear-gradient(to right, var(--gold), var(--gold-light), transparent); }
    .section-heading { margin-bottom: 26px; }

    .button {
      border: 1px solid var(--gold);
      border-radius: 5px;
      padding: 10px 15px;
      background: var(--gold);
      color: #fff;
      font-weight: bold;
      transition: transform .15s, background .15s;
    }
    .button:hover { background: #a96706; transform: translateY(-1px); }
    .button.secondary { background: transparent; color: var(--gold); }
    .button.secondary:hover { background: var(--surface-2); }
    .button.danger { background: var(--danger); border-color: var(--danger); }
    .button.small { padding: 7px 10px; font-size: 13px; }

    .card {
      position: relative;
      padding: 23px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .card::before, .card::after {
      position: absolute; width: 15px; height: 15px; content: ""; border-color: var(--gold);
    }
    .card::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }
    .card::after { right: -1px; bottom: -1px; border-right: 2px solid; border-bottom: 2px solid; }

    .hero { display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 55px; min-height: 65vh; }
    .hero h1 { max-width: 700px; }
    .hero-copy { max-width: 620px; margin: 24px 0; color: var(--muted); font-size: 20px; line-height: 1.65; }
    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .hero-art { min-height: 370px; display: grid; place-items: center; }
    .deco-circle { width: min(350px, 80vw); height: min(350px, 80vw); display: grid; place-items: center; border: 2px solid var(--gold); border-radius: 50%; outline: 1px solid var(--gold-light); outline-offset: -19px; box-shadow: 0 0 0 20px var(--surface-2), 0 0 0 21px var(--gold); }
    .deco-circle strong { color: var(--gold); font-size: 42px; letter-spacing: 5px; text-align: center; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 30px; }
    .stat { padding: 17px; background: var(--surface-2); text-align: center; }
    .stat strong { display: block; color: var(--gold); font-size: 28px; }

    .search { width: 100%; margin-bottom: 26px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); outline: none; }
    .search:focus, textarea:focus, input:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(199,125,11,.16); outline: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 22px; }
    .avatar { display: grid; place-items: center; width: 72px; height: 72px; margin-bottom: 14px; border: 3px solid var(--gold); border-radius: 50%; background: var(--surface-2); color: var(--gold); font-size: 24px; font-weight: bold; }
    .person-name { color: var(--gold); font-size: 23px; }
    .muted { color: var(--muted); }
    .details { min-height: 78px; margin: 11px 0 16px; color: var(--muted); line-height: 1.6; }
    .status { display: inline-block; margin-bottom: 12px; color: var(--success); font-size: 13px; font-weight: bold; }

    .feed-layout { display: grid; grid-template-columns: 1fr 300px; gap: 25px; }
    .composer textarea, .message-form textarea { width: 100%; min-height: 100px; resize: vertical; padding: 13px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }
    .composer-footer { display: flex; justify-content: flex-end; margin-top: 12px; }
    .post { margin-top: 22px; }
    .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .post-header .avatar { width: 45px; height: 45px; margin: 0; border-width: 2px; font-size: 15px; }
    .post-content { white-space: pre-wrap; line-height: 1.6; }
    .post-actions { display: flex; gap: 10px; margin-top: 18px; padding-top: 13px; border-top: 1px solid var(--border); }
    .comment { margin-top: 13px; padding: 10px 13px; background: var(--surface-2); }
    .side-list { display: grid; gap: 12px; }
    .side-item { padding: 14px; background: var(--surface-2); }

    .event-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; }
    .event-date { color: var(--gold); font-size: 13px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
    .event-description { min-height: 60px; margin: 12px 0; color: var(--muted); line-height: 1.55; }

    .messages-layout { display: grid; grid-template-columns: 290px 1fr; min-height: 590px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); }
    .conversation-list { border-right: 1px solid var(--border); }
    .conversation-list h3 { margin: 0; padding: 20px; border-bottom: 1px solid var(--border); }
    .conversation { width: 100%; padding: 15px 19px; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text); text-align: left; }
    .conversation:hover, .conversation.active { background: var(--surface-2); }
    .conversation small { display: block; margin-top: 5px; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .chat { display: flex; flex-direction: column; }
    .chat-header { padding: 20px; border-bottom: 1px solid var(--border); font-size: 20px; font-weight: bold; }
    .chat-messages { display: flex; flex: 1; flex-direction: column; gap: 12px; padding: 22px; overflow-y: auto; }
    .message { max-width: 76%; padding: 11px 15px; border-radius: 15px; line-height: 1.45; }
    .message.mine { align-self: flex-end; background: var(--gold); color: #fff; }
    .message.theirs { align-self: flex-start; background: var(--surface-2); }
    .message-time { display: block; margin-top: 4px; font-size: 10px; opacity: .7; }
    .message-form { display: flex; gap: 10px; padding: 16px; border-top: 1px solid var(--border); }
    .message-form textarea { min-height: 46px; height: 46px; }
    .empty { display: grid; flex: 1; place-items: center; padding: 30px; color: var(--muted); text-align: center; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.58); }
    .modal { width: min(520px, 100%); max-height: 90vh; overflow: auto; }
    .form-row { display: grid; gap: 8px; margin-bottom: 14px; }
    .form-row input, .form-row textarea, .form-row select { width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); color: var(--text); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }
    .hidden { display: none !important; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 50; max-width: 320px; padding: 13px 16px; border: 1px solid var(--gold); background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

    @media (max-width: 800px) {
      .nav { flex-wrap: wrap; padding: 14px 4%; }
      .nav-links { order: 3; width: 100%; justify-content: space-between; }
      .nav-links button { font-size: 10px; padding: 8px 5px; }
      .hero, .feed-layout { grid-template-columns: 1fr; }
      .hero { min-height: auto; }
      .hero-art { min-height: 290px; }
      .messages-layout { grid-template-columns: 1fr; }
      .conversation-list { border-right: 0; border-bottom: 1px solid var(--border); }
      .conversation-list > div { display: flex; overflow-x: auto; }
      .conversation { min-width: 190px; }
    }
    @media (max-width: 470px) {
      .page { padding-top: 30px; }
      .stats { grid-template-columns: 1fr; }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <button class="brand" onclick="navigate('home')" aria-label="Go to home">GradConnect</button>
    <nav class="nav-links" aria-label="Main navigation">
      <button onclick="navigate('feed')">Feed</button>
      <button onclick="navigate('directory')">Directory</button>
      <button onclick="navigate('messages')">Messages</button>
      <button onclick="navigate('events')">Events</button>
      <button onclick="navigate('profile')">Profile</button>
    </nav>
    <div class="nav-actions">
      <button class="icon-button" onclick="toggleTheme()" aria-label="Toggle light and dark mode">◐</button>
    </div>
  </header>

  <main id="app" class="page"></main>
  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden"></div>

  <script>
    const CURRENT_USER_ID = 1;
    const STORAGE_KEY = "gradconnect-single-file-v1";

    const defaultState = {
      theme: "light",
      activePage: "home",
      selectedChat: null,
      connections: {},
      messages: {},
      posts: [
        { id: 1, userId: 2, content: "One may be sad alone, but it takes two or more to believe in what you can do best.", likes: 4, comments: ["This is beautiful. Keep going!"] },
        { id: 2, userId: 3, content: "Throwback to graduation day. Grateful for every friendship made along the way.", likes: 8, comments: [] }
      ],
      likedPosts: {},
      events: [
        { id: 1, title: "Class of 2026 Reunion", date: "2026-12-12", location: "SJCCC Alumni Hall", description: "An evening of memories, music, and reconnecting with classmates.", attending: false },
        { id: 2, title: "Alumni Career Conversation", date: "2027-01-16", location: "Online", description: "A practical conversation about career growth and lifelong learning.", attending: false }
      ]
    };

    const alumni = [
      { id: 1, name: "Philip Olawuyi", school: "SJCCC", year: 2026, bio: "Building meaningful connections with fellow alumni." },
      { id: 2, name: "Emmanuel Balogun", school: "SJCCC", year: 2026, bio: "Interested in technology, business, and collaboration." },
      { id: 3, name: "Amaka Johnson", school: "St. Mary's College", year: 2025, bio: "Creative professional and lifelong learner." },
      { id: 4, name: "Daniel Williams", school: "SJCCC", year: 2024, bio: "Entrepreneur and community volunteer." }
    ];

    let state = loadState();

    function loadState() {
      try { return { ...defaultState, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") }; }
      catch { return structuredClone(defaultState); }
    }
    function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char])); }
    function initials(name) { return name.split(" ").map(part => part[0]).join("").slice(0, 2).toUpperCase(); }
    function person(id) { return alumni.find(item => item.id === Number(id)); }
    function connectionStatus(id) { return state.connections[id] || null; }
    function isConnected(id) { return connectionStatus(id) === "accepted"; }
    function formatDate(date) { return new Date(date + "T12:00:00").toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
    function notify(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message; toast.classList.remove("hidden");
      clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => toast.classList.add("hidden"), 2600);
    }

    function navigate(page) {
      state.activePage = page; state.selectedChat = null; saveState(); render(); window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function toggleTheme() { state.theme = state.theme === "dark" ? "light" : "dark"; saveState(); applyTheme(); }
    function applyTheme() { document.body.classList.toggle("dark", state.theme === "dark"); }

    function render() {
      applyTheme();
      const app = document.getElementById("app");
      if (state.activePage === "home") app.innerHTML = homeView();
      if (state.activePage === "feed") app.innerHTML = feedView();
      if (state.activePage === "directory") app.innerHTML = directoryView();
      if (state.activePage === "messages") app.innerHTML = messagesView();
      if (state.activePage === "events") app.innerHTML = eventsView();
      if (state.activePage === "profile") app.innerHTML = profileView();
    }

    function homeView() {
      return `<div class="container"><section class="hero"><div><div class="eyebrow">A circle that remembers</div><h1>Reconnect with the people who shaped your story.</h1><div class="deco-line"></div><p class="hero-copy">GradConnect is a beautiful alumni space for sharing memories, celebrating milestones, finding classmates, and keeping meaningful connections alive.</p><div class="hero-actions"><button class="button" onclick="navigate('directory')">Find Alumni</button><button class="button secondary" onclick="navigate('feed')">Explore Feed</button></div><div class="stats"><div class="stat"><strong>${alumni.length}</strong>Alumni</div><div class="stat"><strong>${state.posts.length}</strong>Memories</div><div class="stat"><strong>${state.events.length}</strong>Events</div></div></div><div class="hero-art"><div class="deco-circle"><strong>MEMORIES<br>CONNECT<br>US</strong></div></div></section></div>`;
    }

    function feedView() {
      return `<div class="container"><div class="section-heading"><div class="eyebrow">The memory feed</div><h1>What is happening?</h1><div class="deco-line"></div></div><div class="feed-layout"><section><div class="card composer"><textarea id="newPost" placeholder="Share a memory, achievement, or celebration with your class..."></textarea><div class="composer-footer"><button class="button" onclick="createPost()">Share Memory</button></div></div>${state.posts.map(postCard).join("")}</section><aside class="card"><h3>Quick links</h3><div class="side-list"><button class="side-item" onclick="navigate('directory')">Meet more alumni</button><button class="side-item" onclick="navigate('messages')">Open your messages</button><button class="side-item" onclick="navigate('events')">See upcoming events</button></div></aside></div></div>`;
    }
    function postCard(post) {
      const owner = person(post.userId) || alumni[0]; const liked = !!state.likedPosts[post.id];
      return `<article class="card post"><div class="post-header"><div class="avatar">${initials(owner.name)}</div><div><strong>${escapeHtml(owner.name)}</strong><div class="muted">Alumni memory</div></div></div><div class="post-content">${escapeHtml(post.content)}</div><div class="post-actions"><button class="button small ${liked ? "" : "secondary"}" onclick="toggleLike(${post.id})">${liked ? "Liked" : "Like"} (${post.likes})</button><button class="button small secondary" onclick="addComment(${post.id})">Comment (${post.comments.length})</button></div>${post.comments.map(comment => `<div class="comment">${escapeHtml(comment)}</div>`).join("")}</article>`;
    }
    function createPost() { const input = document.getElementById("newPost"); const content = input.value.trim(); if (!content) return notify("Write something before sharing."); state.posts.unshift({ id: Date.now(), userId: CURRENT_USER_ID, content, likes: 0, comments: [] }); saveState(); render(); notify("Memory shared."); }
    function toggleLike(id) { const post = state.posts.find(item => item.id === id); if (!post) return; if (state.likedPosts[id]) { post.likes = Math.max(0, post.likes - 1); delete state.likedPosts[id]; } else { post.likes += 1; state.likedPosts[id] = true; } saveState(); render(); }
    function addComment(id) { const text = prompt("Write a comment:"); if (!text || !text.trim()) return; const post = state.posts.find(item => item.id === id); post.comments.push(text.trim()); saveState(); render(); }

    function directoryView() {
      return `<div class="container"><div class="section-heading"><div class="eyebrow">Alumni directory</div><h1>Find your people</h1><div class="deco-line"></div></div><input class="search" id="directorySearch" oninput="filterDirectory()" placeholder="Search by name, school, or graduation year..."><div id="alumniGrid" class="grid">${alumniCards(alumni)}</div></div>`;
    }
    function alumniCards(list) { return list.map(alumnus => { const status = connectionStatus(alumnus.id); let action = alumnus.id === CURRENT_USER_ID ? `<span class="status">This is your profile</span>` : !status ? `<button class="button" onclick="sendRequest(${alumnus.id})">Connect</button>` : status === "outgoing_pending" ? `<button class="button secondary" disabled>Request Pending</button>` : status === "incoming_pending" ? `<button class="button" onclick="acceptRequest(${alumnus.id})">Accept Request</button>` : `<button class="button" onclick="openChat(${alumnus.id})">Message</button>`; return `<article class="card"><div class="avatar">${initials(alumnus.name)}</div><h3 class="person-name">${escapeHtml(alumnus.name)}</h3><div class="details">${escapeHtml(alumnus.school)}<br>Class of ${alumnus.year}<br>${escapeHtml(alumnus.bio)}</div>${action}</article>`; }).join(""); }
    function filterDirectory() { const query = document.getElementById("directorySearch").value.toLowerCase(); document.getElementById("alumniGrid").innerHTML = alumniCards(alumni.filter(item => `${item.name} ${item.school} ${item.year}`.toLowerCase().includes(query))); }
    function sendRequest(id) { state.connections[id] = "outgoing_pending"; saveState(); render(); notify("Connection request sent."); }
    function acceptRequest(id) { state.connections[id] = "accepted"; saveState(); render(); notify("Connection accepted."); }
    function openChat(id) { if (!isConnected(id)) return notify("Connect with this alumnus before messaging."); state.activePage = "messages"; state.selectedChat = id; saveState(); render(); }

    function messagesView() {
      const connected = alumni.filter(item => item.id !== CURRENT_USER_ID && isConnected(item.id));
      const selected = person(state.selectedChat);
      return `<div class="container"><div class="section-heading"><div class="eyebrow">Private correspondence</div><h1>Messages</h1><div class="deco-line"></div></div><div class="messages-layout"><aside class="conversation-list"><h3>Your conversations</h3><div>${connected.length ? connected.map(conversationButton).join("") : `<div class="empty">Connect with an alumnus from the directory to start messaging.</div>`}</div></aside><section class="chat">${selected ? `<div class="chat-header">${escapeHtml(selected.name)}</div><div id="chatMessages" class="chat-messages">${chatMessages(selected.id)}</div><form class="message-form" onsubmit="sendMessage(event)"><textarea id="messageInput" placeholder="Write a message..."></textarea><button class="button" type="submit">Send</button></form>` : `<div class="empty">Select a connected alumnus to begin a conversation.</div>`}</section></div></div>`;
    }
    function conversationButton(user) { const list = state.messages[user.id] || []; const last = list[list.length - 1]; return `<button class="conversation ${state.selectedChat === user.id ? "active" : ""}" onclick="openChat(${user.id})"><strong>${escapeHtml(user.name)}</strong><small>${last ? escapeHtml(last.content) : "Start a conversation"}</small></button>`; }
    function chatMessages(id) { const list = state.messages[id] || []; if (!list.length) return `<div class="empty">No messages yet. Say hello to ${escapeHtml(person(id).name)}.</div>`; return list.map(message => `<div class="message ${message.senderId === CURRENT_USER_ID ? "mine" : "theirs"}">${escapeHtml(message.content)}<span class="message-time">${new Date(message.createdAt).toLocaleString()}</span></div>`).join(""); }
    function sendMessage(event) { event.preventDefault(); const input = document.getElementById("messageInput"); const content = input.value.trim(); if (!content || !state.selectedChat) return; state.messages[state.selectedChat] ||= []; state.messages[state.selectedChat].push({ senderId: CURRENT_USER_ID, content, createdAt: new Date().toISOString() }); saveState(); render(); }

    function eventsView() { return `<div class="container"><div class="section-heading"><div class="eyebrow">Gather together</div><h1>Events</h1><div class="deco-line"></div></div><div style="display:flex;justify-content:flex-end;margin-bottom:24px"><button class="button" onclick="openEventModal()">Create Event</button></div><div class="event-grid">${state.events.map(event => `<article class="card"><div class="event-date">${formatDate(event.date)}</div><h3>${escapeHtml(event.title)}</h3><div class="muted">${escapeHtml(event.location)}</div><p class="event-description">${escapeHtml(event.description)}</p><button class="button ${event.attending ? "secondary" : ""}" onclick="toggleAttendance(${event.id})">${event.attending ? "Going" : "RSVP"}</button></article>`).join("")}</div></div>`; }
    function toggleAttendance(id) { const event = state.events.find(item => item.id === id); event.attending = !event.attending; saveState(); render(); notify(event.attending ? "RSVP saved." : "RSVP removed."); }
    function openEventModal() { document.getElementById("modalRoot").innerHTML = `<div class="modal-backdrop" onclick="closeModal(event)"><form class="card modal" onclick="event.stopPropagation()" onsubmit="createEvent(event)"><h2>Create event</h2><div class="form-row"><label>Title<input id="eventTitle" required></label></div><div class="form-row"><label>Date<input id="eventDate" type="date" required></label></div><div class="form-row"><label>Location<input id="eventLocation" required></label></div><div class="form-row"><label>Description<textarea id="eventDescription" required></textarea></label></div><div class="modal-actions"><button type="button" class="button secondary" onclick="closeModal()">Cancel</button><button class="button">Create Event</button></div></form></div>`; }
    function closeModal(event) { if (event && event.target !== event.currentTarget) return; document.getElementById("modalRoot").innerHTML = ""; }
    function createEvent(event) { event.preventDefault(); state.events.push({ id: Date.now(), title: document.getElementById("eventTitle").value, date: document.getElementById("eventDate").value, location: document.getElementById("eventLocation").value, description: document.getElementById("eventDescription").value, attending: false }); saveState(); closeModal(); render(); notify("Event created."); }

    function profileView() { const current = person(CURRENT_USER_ID); const connectionCount = Object.values(state.connections).filter(value => value === "accepted").length; return `<div class="container"><div class="section-heading"><div class="eyebrow">Your alumni identity</div><h1>Profile</h1><div class="deco-line"></div></div><div class="card" style="max-width:720px"><div class="avatar" style="width:100px;height:100px;font-size:32px">${initials(current.name)}</div><h2>${escapeHtml(current.name)}</h2><p class="muted">${escapeHtml(current.bio)}</p><div class="stats"><div class="stat"><strong>${connectionCount}</strong>Connections</div><div class="stat"><strong>${state.posts.filter(post => post.userId === CURRENT_USER_ID).length}</strong>Posts</div><div class="stat"><strong>${current.year}</strong>Graduation</div></div></div></div>`; }

    // Demo helper for testing an incoming request from the browser console:
    // state.connections[2] = "incoming_pending"; saveState(); render();
    render();
  </script>
</body>
</html>
